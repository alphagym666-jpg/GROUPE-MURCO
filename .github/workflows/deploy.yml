name: Déployer l'application (GitHub Pages)

on:
  push:
    branches: [main, claude/zen-cray-9q339i]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optionnel: configuration Firebase intégrée (variable de dépôt FIREBASE_CONFIG)
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
