name: App Android (Google Play, signée)

# À lancer à la main (Actions → « App Android (Google Play, signée) » → Run workflow).
# Prérequis: 4 secrets dans GitHub → Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (voir STORES.md). Produit un fichier .aab à téléverser dans la console Google Play.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npx cap sync android
      - name: Préparer la clé de publication
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant (voir STORES.md)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Construire le bundle signé (.aab)
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Brigaxo-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
